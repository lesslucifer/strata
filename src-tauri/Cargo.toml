[package]
name = "strata"
version = "0.1.0"
description = "A Rust + Tauri disk usage analyzer"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
rayon = "1.10"
trash = "5.2"
opener = { version = "0.7", features = ["reveal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
